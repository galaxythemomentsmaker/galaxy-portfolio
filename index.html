<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Galaxy - The Moments Maker</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#000;
color:#fff;
}

.hero{
height:100vh;
background:url("https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=1600&q=80");
background-size:cover;
background-position:center;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
position:relative;
}

.hero::before{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,.55);
}

.content{
position:relative;
z-index:2;
}

h1{
font-size:70px;
letter-spacing:3px;
}

h2{
margin-top:15px;
color:#ffc107;
font-size:30px;
}

p{
margin-top:20px;
font-size:20px;
}

.btn{
display:inline-block;
margin-top:40px;
padding:15px 40px;
background:#ffc107;
color:#000;
text-decoration:none;
font-weight:bold;
border-radius:40px;
transition:.3s;
}

.btn:hover{
background:#ff9800;
}

</style>

</head>

<body>

<section class="hero">

<div class="content">

<h1>GALAXY</h1>

<h2>THE MOMENTS MAKER</h2>

<p>
Professional Photography • Cinematography • Wedding Films
</p>

<p>
Hooghly, West Bengal | Available Across India
</p>

<a class="btn" href="#">
Book Your Event
</a>

</div>

</section>

</body>
</html>
