font-family:Arial,Helvetica,sans-serif;
}

body{
background:#000;
color:#fff;
}

.hero{
height:100vh;
padding-top:80px;
padding-left:30px;
padding-right:30px;

background-position:center;
display:flex;

justify-content:center;

position:relative;
overflow:hidden;
}

.hero::before{

);
}

color:#ffc107;
font-size:34px;
letter-spacing:3px;
animation:fadeUp 1.3s ease;
}

font-size:22px;
line-height:1.8;
max-width:850px;
animation:fadeUp 1.6s ease;
}

margin-top:40px;
padding:15px 40px;
background:#ffc107;
color:#000;

font-weight:bold;
border-radius:40px;
transition:.35s;
box-shadow:0 8px 20px rgba(0,0,0,.3);
}

.btn:hover{
background:#ff9800;
transform:translateY(-4px);

}
.buttons{
margin-top:40px;

justify-content:center;

}

position:fixed;
top:0;
left:0;
width:100%;
padding:18px 70px;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(15,15,15,.18);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,.08);
transition:.4s;
z-index:999;
}

.logo{
font-size:28px;
font-weight:bold;
color:#ffc107;
}

.logo{
font-size:34px;
font-weight:800;
color:#ffc107;
letter-spacing:2px;
}

.menu{
display:flex;
list-style:none;
gap:30px;
}

.menu a{
color:#fff;
text-decoration:none;
font-size:17px;
font-weight:600;
padding:8px 14px;
border-radius:30px;
transition:.35s;
}

.menu a:hover{
background:#ffc107;
color:#000;
}
@keyframes fadeUp{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}
