<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy - The Moments Maker</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial,Helvetica,sans-serif;
            background:#000;
            color:#fff;
        }

        .hero{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            text-align:center;
            background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.75)),
            url("https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=1600&q=80");
            background-size:cover;
            background-position:center;
        }

        h1{
            font-size:64px;
            letter-spacing:3px;
        }

        h2{
            color:#d4af37;
            margin-top:15px;
            font-weight:400;
        }

        p{
            margin-top:25px;
            font-size:20px;
        }

        .btn{
            margin-top:40px;
            padding:16px 40px;
            text-decoration:none;
            color:#fff;
            background:#d4af37;
            border-radius:50px;
            font-weight:bold;
        }

        .btn:hover{
            background:#b98b10;
        }
    </style>

</head>

<body>

<section class="hero">

<h1>GALAXY</h1>

<h2>THE MOMENTS MAKER</h2>

<p>
Professional Photography • Cinematography • Wedding Films
</p>

<p>
Hooghly, West Bengal | Available Across India
</p>

<a class="btn" href="#">Book Your Event</a>

</section>

</html>
